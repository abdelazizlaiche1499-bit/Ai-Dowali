<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>A54 Image Switch</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #080808;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* الدائرة */
.image-container {
    width: 78vw;
    height: 78vw;

    max-width: 850px;
    max-height: 850px;

    border-radius: 50%;
    overflow: hidden;

    border: 8px solid white;

    cursor: pointer;

    box-shadow:
        0 0 25px rgba(255,255,255,0.55),
        0 0 70px rgba(255,255,255,0.3),
        0 20px 80px rgba(0,0,0,0.9);

    transition:
        transform 0.3s ease,
        opacity 0.2s ease;
}

/* الصورة */
.image-container img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

/* تأثير التبديل */
.changing {
    opacity: 0;
}

/* ضغط */
.image-container:active {
    transform: scale(0.96);
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>

<body>

<div class="image-container" id="imageContainer">

    <img
        id="mainImage"
        src="https://i.ibb.co/HJY8jVL/file-000000001f50820aa73aeb0bb2fa1902.png"
        alt="الصورة">

</div>


<script>

const image1 =
"https://i.ibb.co/HJY8jVL/file-000000001f50820aa73aeb0bb2fa1902.png";

const image2 =
"https://i.ibb.co/hJZjgfn6/file-00000000ced88210a9ad9ee381c6efb0.png";

const image =
document.getElementById("mainImage");

const container =
document.getElementById("imageContainer");

let secondImage = false;


container.addEventListener("click", function() {

    image.classList.add("changing");

    setTimeout(function() {

        if (secondImage === false) {

            image.src = image2;
            secondImage = true;

        } else {

            image.src = image1;
            secondImage = false;

        }

        image.classList.remove("changing");

    }, 180);

});

</script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
